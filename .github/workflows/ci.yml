name: ci

on:
  push:
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync
      - run: uv run ruff check src tests
      - run: uv run pytest

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose files
        run: |
          cp .env.docker.example .env.docker
          docker compose --env-file .env.docker -f compose.yaml config --quiet
          docker compose --env-file .env.docker -f compose.api-only.yaml config --quiet
      - name: Build API image
        run: |
          docker build \
            --file docker/Dockerfile.api \
            --build-arg PYTHON_IMAGE=python:3.12-slim-bookworm \
            --build-arg NODE_IMAGE=node:24-bookworm-slim \
            --tag dots-mocr-mineru-gateway:ci \
            .
